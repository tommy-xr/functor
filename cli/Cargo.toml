[package]
name = "functor-cli"
version = "0.0.0-dev"
edition = "2021"


[[bin]]
name = "functor"
path = "src/main.rs"

[features]
# `web` embeds the WebGL2 runtime bundle (`include_bytes!`) for `run wasm`, so it
# requires `npm run build:cli` first. ON by default; disable it
# (`--no-default-features`) for a FAST native + typecheck build that needs no
# wasm bundle — `run wasm` then errors with a rebuild hint.
default = ["web"]
web = []
# `app` links the desktop app (`app/functor-app`) in: bare `functor` and
# `functor app …` open it in-process, and every child it starts is this same
# executable (D40). Off by default, so the workspace build and CI's CLI build
# stay as they are; `npm run build:cli` turns it on on macOS. Embeds the UI
# bundle when it exists (`npm run build:app-ui`).
app = ["dep:functor-app"]
# The app's local speech-to-text (whisper.cpp; implies `app`).
whisper = ["app", "functor-app/whisper"]

[dependencies]
# The Functor Lang language, for `language: "functor-lang"` projects (docs/functor-lang.md Track C4).
functor-lang = { path = "../functor-lang" }
# Engine-bundled `.fun` modules and host `.funi` interfaces, shared with the
# runtimes and editor tooling.
functor-prelude = { path = "../functor-prelude" }
# Mesh + STL writing for `functor export`.
functor-solid = { path = "../functor-solid" }
functor-docgen = { path = "../tools/functor-docgen" }
# `adb devices` parsing and the headset app's package, shared with the app's
# cable pairing.
functor-device-link = { path = "../runtime/functor-device-link" }
clap = { version = "4.5.6", features = ["derive"] }
colored = "2.1.0"
# The `log` facade: the CLI installs a logger that turns any `log!` (its own or
# the in-process runtime's) into a region-aware `Event::Log` (cli/src/output.rs).
log = "0.4"
# The ink-style live region: spinners + a sticky telemetry panel above
# scrollback, on an interactive TTY only (see cli/src/output/live.rs).
indicatif = "0.17"
# Blocking HTTP for `functor import`'s sidecar-declared remote assets (run on
# a dedicated thread — the CLI's tokio context can't host a blocking client).
# Same version/TLS as the desktop runtime's async reqwest, so cargo unifies.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
# `functor bake` writes lightmap PNGs with text chunks (the version `image` uses).
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.117"
tokio = { version = "1", features = ["full"] }
warp = "0.3.7"
functor_runtime_common = { path = "../runtime/functor-runtime-common" }
# The desktop runtime (GLFW/OpenGL). `functor run native` drives its run loop
# in-process — post-E3 there is a single `functor` binary, always with GL.
functor-runtime-desktop = { path = "../runtime/functor-runtime-desktop" }
rmcp = { version = "2.2.0", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
# `functor mcp --http`: mounts rmcp's streamable-HTTP service (same version as the app).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# Constant-time bearer-token comparison (already in the tree via rustls).
subtle = "2.6"
base64 = "0.22"
# Reads entries from zip archives (e.g. `.kpf`) mapped as external prefixes.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
schemars = "1.2"
# `functor fuzz`'s scratch save store.
tempfile = "3"
# The desktop app, in-process (feature `app`).
functor-app = { path = "../app/functor-app", optional = true }
