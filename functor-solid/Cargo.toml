[package]
name = "functor-solid"
version = "0.1.0"
edition = "2021"

# Printable solid geometry for Functor parts: a pure description tree, its
# triangle mesh, and file export. Engine-free (no GL, no interpreter) so it
# stays unit-testable and can be split out or feature-gated later.
[dependencies]
cgmath = "0.18.0"
# 2D polygon booleans + offset (integer-snapped: robust, deterministic, wasm-clean).
i_overlay = "9.1"
# Constrained triangulation of polygons with holes (extrusion caps).
i_triangle = "0.50"
# Text: HarfBuzz-compatible shaping + glyph outlines (one read-fonts stack).
harfrust = "0.8.4"
# Unhinted outlines only: no autohinter.
skrifa = { version = "0.42.1", default-features = false, features = ["std"] }
