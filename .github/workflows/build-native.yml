name: Build Native

on:
  push:
    branches: [main]
  pull_request:
    # `closed` runs only to cancel the PR's in-flight run (see concurrency).
    types: [opened, synchronize, reopened, closed]

# A new push to a PR, or closing it, cancels its in-flight run. On main, a
# newer push replaces the queued run but lets the running one finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-native:
    if: github.event.action != 'closed'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: npm install -g wasm-pack

      - name: Install Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libglfw3 \
            libglfw3-dev \
            libasound2-dev \
            libfontconfig-dev

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          # PRs restore main's cache without saving their own (shared 10 GB budget).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build Runtime
        run: cargo build --features=strict
        working-directory: runtime/functor-runtime-desktop

      # Run the unit tests here (rather than a standalone job) to get coverage
      # across the whole OS matrix for free: this job already has the common
      # runtime compiled. The functor-lang suite runs on the default test-thread stack —
      # that is deliberate: it guards the MAX_EVAL_DEPTH-fits-2-MiB budget (#221).
      # The `ts` features add the drift tests for the generated TS wire types:
      # the SDK's debug protocol (tools/functor-sdk/src/generated/protocol.ts)
      # and the desktop app's (app/ui/src/generated/protocol.ts).
      - name: Run tests
        run: |
          cargo test -p functor_runtime_common -p functor-lang -p functor-docgen -p functor-solid -p functor-app-core -p functor-app -p functor-device-link --features functor_runtime_common/ts,functor-app-core/ts

      - name: Validate API documentation generation
        run: npm run check:docs

      # Building the web bundle is necessary for the CLI,
      # since the cli includes the web bundle for dev server
      - name: Build runtime wasm bundle
        run: wasm-pack build --target web
        working-directory: runtime/functor-runtime-web

      - name: Build CLI
        run: cargo build
        working-directory: cli

      # The app's session test, its agent test's tool-server case and its
      # new-project test drive a real `functor` (skipped in "Run tests",
      # which runs before the CLI exists).
      - name: Test app game sessions and agent tools
        run: cargo test -p functor-app --test session --test agent --test creation
        env:
          FUNCTOR_BIN: ${{ github.workspace }}/target/debug/functor${{ runner.os == 'Windows' && '.exe' || '' }}

      # The app's real window (macOS only): opens it, waits until its page has
      # connected, closes it. The page needs the UI bundle, hence npm.
      - name: Window smoke
        if: matrix.os == 'macos-latest'
        run: |
          npm ci
          npm run build:app-ui
          cargo run -q -p functor-app -- --window-smoke -d examples/primitives --ui-dir app/ui/dist
        env:
          FUNCTOR_APP_HOME: ${{ runner.temp }}/functor-app-home

      # `functor mcp --http` against the real binary (cargo builds it for the
      # test; no GPU: its one launched game runs headless).
      - name: Test MCP over HTTP
        run: cargo test -p functor-cli --test mcp_http

      # `functor init`'s templates: each one builds and passes its expects, the
      # table matches the template directories (examples included), `--list`
      # matches its snapshots, and MCP `init_game` takes every name.
      - name: Test project templates
        run: cargo test -p functor-cli --bin functor -- commands::init init_game init_dispatches
