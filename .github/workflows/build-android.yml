name: Build Android

# Builds the Quest tool APK (runtime/functor-runtime-oculus) for every main
# push and PR head, and uploads it as `functor-apk-<sha>` so a PR can be tried
# on a headset without building it locally.
#
# Release profile (optimized, not debuggable, so `bench:quest` accepts it),
# signed with the shared dev key from ANDROID_DEV_KEYSTORE_BASE64 /
# ANDROID_DEV_KEYSTORE_PASSWORD. A fork PR gets no secrets and falls back to
# a throwaway Android debug key; upstream refuses to publish without the dev
# key. The APK reports `pr | <sha7>` as `/state.build`.

on:
  push:
    branches: [main]
  pull_request:
  # Builds a branch head on demand (e.g. one from before this workflow).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The PR head, not the merge commit: the APK is that commit's build.
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # The NDK the oculus README and `npm run build:oculus:apk` use.
      NDK_VERSION: 24.0.8215888
      OPENXR_LOADER_VERSION: 1.1.61
      OPENXR_LOADER_SHA256: 7e37e8e748b8b6cd636bf5464c70332a4390a635909de873d77c854d5a1e95bd
      APK: target-android/release/apk/functor_runtime_oculus.apk
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "runtime/functor-runtime-oculus -> ../../target-android"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-apk@0.9.7

      - name: Install NDK + android-32 platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "platforms;android-32" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # The APK bundles the Khronos OpenXR loader (gitignored locally; see the
      # oculus README).
      - name: Fetch the OpenXR loader
        run: |
          aar="$RUNNER_TEMP/openxr_loader.aar"
          curl -fsSL -o "$aar" "https://repo1.maven.org/maven2/org/khronos/openxr/openxr_loader_for_android/$OPENXR_LOADER_VERSION/openxr_loader_for_android-$OPENXR_LOADER_VERSION.aar"
          echo "$OPENXR_LOADER_SHA256  $aar" | sha256sum -c
          unzip -j "$aar" jni/arm64-v8a/libopenxr_loader.so -d runtime/functor-runtime-oculus/lib/arm64-v8a/

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/dev.keystore"
          trap 'rm -f "$CARGO_APK_RELEASE_KEYSTORE"' EXIT
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$CARGO_APK_RELEASE_KEYSTORE"
            export CARGO_APK_RELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            echo "SIGNER=CN=Functor Dev (CI)" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -noprompt -keystore "$CARGO_APK_RELEASE_KEYSTORE" \
              -alias androiddebugkey -storepass android -keypass android \
              -dname 'CN=Android Debug, O=Android, C=US' -keyalg RSA -keysize 2048 -validity 10000
            export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android
            echo "SIGNER=CN=Android Debug" >> "$GITHUB_ENV"
          fi
          export FUNCTOR_BUILD_LABEL="pr | ${SHA::7}"
          CARGO_TARGET_DIR="$PWD/target-android" cargo apk build --release \
            --manifest-path runtime/functor-runtime-oculus/Cargo.toml

      - name: Verify APK
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -1)"
          "$build_tools/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs"
          grep -F "certificate DN: $SIGNER" "$RUNNER_TEMP/certs"
          # 0.0.0 sorts below every release; not debuggable, so bench:quest accepts it.
          "$build_tools/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging"
          grep -F "package: name='dev.functor.runner' versionCode='16777216' versionName='0.0.0'" "$RUNNER_TEMP/badging"
          if grep -F application-debuggable "$RUNNER_TEMP/badging"; then exit 1; fi
          unzip -p "$APK" lib/arm64-v8a/libfunctor_runtime_oculus.so | grep -qaF "pr | ${SHA::7}"

      # Without the secrets the APK above is debug-signed; publishing it would
      # break in-place replacement of every dev-key install.
      - name: Require the dev signing key
        if: >-
          env.SIGNER != 'CN=Functor Dev (CI)' && !github.event.repository.fork &&
          (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        run: |
          echo "::error::Missing repository secrets ANDROID_DEV_KEYSTORE_BASE64 and ANDROID_DEV_KEYSTORE_PASSWORD. Create them once with: keytool -genkeypair -keystore functor-dev.keystore -alias functor-dev -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Functor Dev (CI), O=tommy-xr' (choose a store password when prompted), then: base64 < functor-dev.keystore | gh secret set ANDROID_DEV_KEYSTORE_BASE64 && gh secret set ANDROID_DEV_KEYSTORE_PASSWORD (paste the same password). Keep functor-dev.keystore to sign local builds (see runtime/functor-runtime-oculus/README.md)."
          exit 1

      # `npm run pr` finds this by head SHA.
      - uses: actions/upload-artifact@v4
        with:
          name: functor-apk-${{ env.SHA }}
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 30
