name: Build WebAssembly

on:
  push:
    branches: [main]
  pull_request:
    # `closed` runs only to cancel the PR's in-flight run (see concurrency).
    types: [opened, synchronize, reopened, closed]

# A new push to a PR, or closing it, cancels its in-flight run. On main, a
# newer push replaces the queued run but lets the running one finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-wasm:
    if: github.event.action != 'closed'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: npm install -g wasm-pack

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          # PRs restore main's cache without saving their own (shared 10 GB budget).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build runtime wasm bundle
        run: wasm-pack build --target web
        working-directory: runtime/functor-runtime-web
