name: E2E (headless)

# Runs the @functor/sdk end-to-end tests against the real `functor` CLI (which
# drives the native runtime in-process via `functor run native`) in
# --headless mode (no GL window). Covers: input -> state, capture-unavailable,
# and a real WebSocket network sim (1 server + 2 clients converging on a shared
# world).
#
# Runs on macOS: that's where the native runner is known-good (the dev machine +
# the e2e locally), and headless needs no display, so a headless macOS runner is
# enough — no GL system deps. (macOS provides the Cocoa/OpenGL frameworks the
# runner links.) Linux is deferred: the native runner currently SIGSEGVs shortly
# after the game dylib's init() on Linux — a dlopen/duplicate-runtime issue with
# the Rust `dylib` game (works under macOS two-level namespaces). Tracked as a
# follow-up; moving this job to ubuntu is the payoff once that's fixed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      repeats:
        description: >
          Run the suite this many times back-to-back (flake stress:
          `gh workflow run e2e.yml --ref <branch> -f repeats=5`). The suite
          runs to the first failing iteration.
        required: false
        default: "1"

jobs:
  e2e-headless:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: npm install -g wasm-pack

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      # The single `functor` binary embeds the web-runtime bundle via
      # `include_bytes!`, so that bundle must exist before the CLI is built —
      # even though this native e2e job never serves wasm.
      - name: Build web runtime bundle
        run: wasm-pack build --target=web
        working-directory: runtime/functor-runtime-web

      - name: Build functor CLI
        run: cargo build --bin functor

      - name: Install SDK dependencies
        run: npm install
        working-directory: tools/functor-sdk

      - name: Run headless e2e
        # The input goes through env (never interpolated into the script —
        # dispatch inputs are attacker-controlled text), and is validated so a
        # bad value fails LOUDLY instead of `seq` erroring inside a command
        # substitution and the empty loop passing green having run nothing.
        env:
          REPEATS: ${{ github.event.inputs.repeats || '1' }}
        run: |
          if ! [[ "$REPEATS" =~ ^[1-9][0-9]*$ ]]; then
            echo "invalid repeats input: $REPEATS" >&2
            exit 1
          fi
          for ((i = 1; i <= REPEATS; i++)); do
            echo "::group::e2e iteration $i of $REPEATS"
            npm run test:e2e:headless
            echo "::endgroup::"
          done
        working-directory: tools/functor-sdk
