[package]
name = "functor-app"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.6", features = ["derive"] }
functor-app-core = { path = "../functor-app-core" }
serde_json = "1.0"
# Game-session children, signals and timers; the runtime task 1.3's server
# will share.
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
