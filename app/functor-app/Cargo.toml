[package]
name = "functor-app"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
clap = { version = "4.5.6", features = ["derive"] }
functor-app-core = { path = "../functor-app-core" }
# The device link's protocol: framing, pairing, the authenticated transport.
functor-device-link = { path = "../../runtime/functor-device-link", features = ["capsule", "file"] }
# Speech-to-text for headset clips and the composer mic (whisper.cpp with
# the `whisper` feature; without it, voice says it is not in this build).
functor-stt = { path = "../functor-stt" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Advertises the device link on the LAN (pure Rust, no async runtime).
mdns-sd = { version = "0.21", default-features = false }
# The agent runner (claude / codex) and its event types; one pinned revision.
mis-agent = { git = "https://github.com/tommy-xr/MakeItSo", rev = "139014e8f03ba79359c2a200b5c44d66307c9e1e" }
mis-types = { git = "https://github.com/tommy-xr/MakeItSo", rev = "139014e8f03ba79359c2a200b5c44d66307c9e1e" }
serde = "1.0"
serde_json = "1.0"
# Constant-time token comparison (as the CLI's MCP bearer check uses).
subtle = "2.6"
# Game-session children, signals and timers; the server runs on the same
# runtime.
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
# Kills a hung tool server's process tree, and finds child processes in
# tests, on every OS (the version mis-agent uses).
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# The device link's WebSocket, both roles (axum's own `ws` uses this version).
tokio-tungstenite = "0.29"
# Task ids for `mis-agent` runs and the tool server's bearer tokens.
uuid = { version = "1", features = ["v4"] }

[features]
# Local speech-to-text (whisper.cpp; its model is fetched on first use).
# Off by default so tests and CI skip the C++ build; `npm run build:app`
# turns it on.
whisper = ["functor-stt/whisper"]

# The window (macOS only for now): a WKWebView (wry) on tao's event loop, the
# menu bar that gives it Quit, Open Folder and the Edit shortcuts (muda), and
# its native folder picker (rfd: AppKit's NSOpenPanel through the objc2
# crates wry already uses).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
rfd = { version = "0.17", default-features = false }
tao = "0.37"
wry = { version = "0.57", default-features = false }

[dev-dependencies]
# The headset's client, driven against this app in the device-link tests.
functor-device-link = { path = "../../runtime/functor-device-link", features = ["client"] }
# The debug server's `POST /input` type, for the `GameInput` drift test.
functor_runtime_common = { path = "../../runtime/functor-runtime-common" }
tempfile = "3"
