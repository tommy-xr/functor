<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>functor sandbox — live Functor Lang playground</title>
    <meta
      name="description"
      content="Write Functor Lang in the browser and watch the scene hot-reload live, model preserved."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="sandbox-page">
    <!--@header suffix="SANDBOX" active="sandbox"-->
      <!--
        The pre-JS paint. sandbox.tsx renders this row as a React island, which
        replaces these children on mount — keep the skeleton in step with the
        initial stores there (notably the pill's state and label) so the swap is
        invisible.
      -->
      <div class="sandbox-controls">
        <label class="picker-label" for="example-picker">scene</label>
        <select id="example-picker"></select>
        <button id="reset" type="button" title="Reload the example (resets the model)">
          ↺ reset
        </button>
        <div id="runtime-target"></div>
        <span id="status" class="status-pill" data-state="busy">◌ loading…</span>
      </div>
    <!--/@header-->

    <main class="sandbox-split">
      <!--
        The file sidebar, hidden until the loaded example proves it has more
        than one .fun (src/sandbox.tsx unhides it, and the FilePane island
        replaces these children on mount). A single-file example never sees it.
      -->
      <aside class="file-pane" hidden>
        <div class="file-pane-head">
          <span class="file-pane-title">Files</span>
        </div>
        <div id="file-list" class="file-list"></div>
      </aside>
      <section class="editor-pane">
        <div id="editor"></div>
      </section>
      <section class="preview-pane">
        <!-- The boot loader. Static markup on purpose: it paints on the first
             frame, long before the editor bundle and the wasm runtime arrive.
             src/sandbox.tsx dismisses it (`.is-done`); the rest is styles.css. -->
        <div class="fn-boot" data-fn-boot>
          <svg class="fn-boot-defs" aria-hidden="true">
            <symbol id="fn-boot-mark" viewBox="366 163 385 690">
              <path d="M382 341 545 179H735L615 300H548L382 466Z" />
              <path d="M382 493 497 380V748L382 837Z" />
              <path d="M518 426H693L597 522H518Z" />
            </symbol>
          </svg>
          <div class="fn-boot-word" aria-hidden="true">FUNCTOR</div>
          <div class="fn-boot-stage" aria-hidden="true">
            <div class="fn-boot-spin">
          <span class="fn-boot-slice" style="--i:0"><svg><use href="#fn-boot-mark" /></svg></span>
          <span class="fn-boot-slice" style="--i:1"><svg><use href="#fn-boot-mark" /></svg></span>
          <span class="fn-boot-slice" style="--i:2"><svg><use href="#fn-boot-mark" /></svg></span>
          <span class="fn-boot-slice" style="--i:3"><svg><use href="#fn-boot-mark" /></svg></span>
          <span class="fn-boot-slice" style="--i:4"><svg><use href="#fn-boot-mark" /></svg></span>
          <span class="fn-boot-slice" style="--i:5"><svg><use href="#fn-boot-mark" /></svg></span>
          <span class="fn-boot-slice" style="--i:6"><svg><use href="#fn-boot-mark" /></svg></span>
          <span class="fn-boot-slice" style="--i:7"><svg><use href="#fn-boot-mark" /></svg></span>
          <span class="fn-boot-slice" style="--i:8"><svg><use href="#fn-boot-mark" /></svg></span>
            </div>
          </div>
          <p class="fn-boot-label" role="status">loading<span class="fn-boot-dots"></span></p>
        </div>
        <iframe id="player" title="live game preview" allow="pointer-lock"></iframe>
      </section>
    </main>

    <div id="statusbar"></div>

    <!-- Splitting keeps the opt-in Vim adapter lazy. Preload the editor's
         static CodeMirror chunk so that split does not add a serial RTT. -->
    <link rel="modulepreload" href="assets/sandbox-chunk.js" />
    <script type="module" src="assets/sandbox.js"></script>
  </body>
</html>
